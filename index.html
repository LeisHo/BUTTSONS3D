<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buttsons3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: var(--app-bg-color);
  }
  :root {
    --app-bg-color: #14151a;
    --dev-title-font-size: 13px;
    --dev-tab-font-size: 11.5px;
    --dev-group-title-font-size: 12px;
    --dev-setting-title-font-size: 12px;
    --dev-body-font-size: 12px;
    --dev-panel-opacity: 0.92;
    --dev-bg-color: #0f1014;
    --dev-title-color: #9fd3ff;
    --dev-text-color: #e6e6e6;
  }
  #sceneCanvas {
    position: fixed;
    inset: 0;
    display: block;
  }
  /* Shown only until BUTTON MODEL.fbx finishes loading (see loadButtonModel()'s .then) --
     a real binary asset fetch, unlike everything else on this page, so on a slow/cold
     connection there's a genuine multi-second window with nothing on screen otherwise
     (the ground plane stays hidden until then too -- see its own construction comment). */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a8f9c;
    font: 14px system-ui, sans-serif;
    pointer-events: none;
    background: var(--app-bg-color);
    z-index: 1;
  }
  #loadingOverlay.hidden { display: none; }

  /* ---- Dev panel (mechanics ported from the BUTTSONS project's own dev panel) ---- */
  body:not(.dev-enabled) #devPanel { display: none !important; }
  body.dev-hidden #devPanel { display: none !important; }

  #devPanel {
    position: fixed;
    display: flex;
    flex-direction: column;
    background: var(--dev-bg-color);
    opacity: var(--dev-panel-opacity);
    border: 1px solid #333a4a;
    border-radius: 6px;
    color: var(--dev-text-color);
    font: var(--dev-body-font-size)/1.4 system-ui, sans-serif;
    z-index: 1000;
    min-width: 260px;
    min-height: 160px;
    overflow: hidden;
  }
  #devPanel.collapsed .dev-body { display: none; }
  #devPanel .dev-titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    cursor: move;
    background: #1c1e24;
    user-select: none;
  }
  #devPanel .dev-title {
    font-size: var(--dev-title-font-size);
    font-weight: 700;
    color: var(--dev-title-color);
  }
  #devPanel .dev-collapse-btn {
    background: none;
    border: none;
    color: var(--dev-text-color);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 6px;
  }
  #devPanel .dev-body {
    display: flex;
    flex-direction: column;
    min-height: 0;
    flex: 1;
  }
  .dev-tabs {
    display: flex;
    border-bottom: 1px solid #262932;
  }
  .dev-tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--dev-text-color);
    font-size: var(--dev-tab-font-size);
    padding: 6px 0;
    cursor: pointer;
    opacity: 0.6;
  }
  #devPanel.tab-desktop .dev-tab-btn[data-tab="desktop"],
  #devPanel.tab-mobile .dev-tab-btn[data-tab="mobile"] {
    opacity: 1;
    border-bottom: 2px solid var(--dev-title-color);
  }
  .dev-actions {
    display: flex;
    gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid #262932;
  }
  .dev-actions button {
    flex: 1;
    background: #262932;
    border: 1px solid #333a4a;
    color: var(--dev-text-color);
    border-radius: 4px;
    padding: 5px 0;
    cursor: pointer;
    font-size: var(--dev-body-font-size);
  }
  .dev-actions button:hover { background: #33374a; }
  #devSaveStatus {
    padding: 0 8px 4px;
    font-size: 10px;
    opacity: 0.6;
  }
  #devGroups {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  /* Was opacity:0.4 -- against this panel's near-black background that read as the dragged
     row/group nearly vanishing ("becomes dark") rather than as a clear "this is what you're
     moving" indicator. Full opacity + a light tint + an outline in the panel's own accent
     color (var(--dev-title-color), so the outline specifically still tracks a user-
     customized Dev Panel Title Text Color) stays legible instead. */
  .dev-group.dragging-item { background: rgba(255, 255, 255, 0.08); outline: 1px solid var(--dev-title-color); outline-offset: -1px; }
  .dev-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: #1c1e24;
    cursor: pointer;
    user-select: none;
  }
  .dev-group-header .drag-grip { cursor: grab; opacity: 0.5; }
  .dev-group-title {
    font-size: var(--dev-group-title-font-size);
    font-weight: 600;
    flex: 1;
  }
  .dev-group-caret { opacity: 0.6; font-size: 10px; }
  .dev-group.collapsed .dev-group-body { display: none; }
  .dev-group-body { padding: 6px 8px; }
  .dev-tab-desktop, .dev-tab-mobile { display: none !important; }
  #devPanel.tab-desktop .dev-tab-desktop,
  #devPanel.tab-mobile .dev-tab-mobile { display: flex !important; }
  .dev-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
  }
  .dev-row.dragging-item { background: rgba(255, 255, 255, 0.08); outline: 1px solid var(--dev-title-color); outline-offset: -1px; }
  .dev-row .drag-grip { cursor: grab; opacity: 0.4; font-size: 10px; }
  .dev-row-main { flex: 1; min-width: 0; }
  .dev-setting-label {
    font-size: var(--dev-setting-title-font-size);
    display: block;
    margin-bottom: 2px;
  }
  .dev-controls { display: flex; align-items: center; gap: 6px; }
  .dev-controls input[type="range"] { flex: 1; min-width: 0; }
  .dev-value {
    font-size: var(--dev-body-font-size);
    min-width: 3.5em;
    text-align: right;
    cursor: text;
    padding: 1px 3px;
    border-radius: 3px;
  }
  .dev-value:hover { background: rgba(255,255,255,0.08); }
  .dev-value input {
    width: 4.5em;
    background: #000;
    color: var(--dev-text-color);
    border: 1px solid #444;
    font: inherit;
  }
  .dev-camera-presets { padding: 6px 0 2px; }
  .dev-camera-select {
    width: 100%;
    min-height: 60px;
    resize: vertical;
    overflow-y: auto;
    background: #000;
    color: var(--dev-text-color);
    border: 1px solid #444;
    font: inherit;
    font-size: var(--dev-body-font-size);
    box-sizing: border-box;
  }
  .dev-camera-select option { padding: 2px 4px; }
  .dev-camera-presets .dev-actions { padding: 6px 0 0; border-bottom: none; }
  .dev-color-row input[type="color"] {
    width: 28px;
    height: 22px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
  }
  .dev-checkbox-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  /* Resize/move hit zones */
  .dev-resize-edge { position: absolute; z-index: 2; }
  .dev-resize-edge.n { top: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
  .dev-resize-edge.s { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
  .dev-resize-edge.e { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
  .dev-resize-edge.w { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
  .dev-resize-corner { position: absolute; z-index: 3; width: 10px; height: 10px; }
  .dev-resize-corner.nw { top: -3px; left: -3px; cursor: nwse-resize; }
  .dev-resize-corner.ne { top: -3px; right: -3px; cursor: nesw-resize; }
  .dev-resize-corner.sw { bottom: -3px; left: -3px; cursor: nesw-resize; }
  .dev-resize-corner.se { bottom: -3px; right: -3px; cursor: nwse-resize; }
</style>
</head>
<body>

<canvas id="sceneCanvas"></canvas>

<div id="loadingOverlay">Loading model&hellip;</div>

<div id="devPanel">
  <div class="dev-resize-edge n"></div>
  <div class="dev-resize-edge s"></div>
  <div class="dev-resize-edge e"></div>
  <div class="dev-resize-edge w"></div>
  <div class="dev-resize-corner nw"></div>
  <div class="dev-resize-corner ne"></div>
  <div class="dev-resize-corner sw"></div>
  <div class="dev-resize-corner se"></div>
  <div class="dev-titlebar">
    <span class="dev-title">DEV</span>
    <button class="dev-collapse-btn" id="devCollapseBtn" title="Collapse">&#9650;</button>
  </div>
  <div class="dev-body">
    <div class="dev-tabs">
      <button class="dev-tab-btn" data-tab="desktop">Desktop</button>
      <button class="dev-tab-btn" data-tab="mobile">Mobile</button>
    </div>
    <div class="dev-actions">
      <button id="btnCopy">Copy Settings</button>
      <button id="btnSave">Save Settings</button>
      <button id="btnReset">Reset</button>
    </div>
    <div id="devSaveStatus">Local-only for now -- git-tracked sync not wired up yet for this project.</div>
    <div id="devGroups"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { OutlinePass } from "three/addons/postprocessing/OutlinePass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

(function () {
  "use strict";

  // ---- Dev gating (CLAUDE.md 12b) ----
  function isDevAllowed() {
    var h = location.hostname;
    if (h === "localhost" || h === "127.0.0.1" || location.protocol === "file:") return true;
    try {
      return new URLSearchParams(location.search).get("dev") === "1";
    } catch (e) {
      return /[?&]dev=1(&|$)/.test(location.search);
    }
  }
  if (isDevAllowed()) {
    document.body.classList.add("dev-enabled");
  }

  // ---- Settings ----
  var DEFAULT_SETTINGS = {
    colCount: 14,
    rowCount: 14,
    colSpacing: 0.7,
    rowSpacing: 0.75,
    rowXOffset: -2,
    cumulativeRowOffset: true,

    // baseRadius/baseHeight/buttonRadius/buttonHeight are SCALE FACTORS (1.0 = the real
    // model's own authored size) now that the button is real geometry (data/BUTTON
    // MODEL.fbx), not a resizable procedural cylinder -- see NATURAL_BASE_RADIUS/
    // NATURAL_BASE_HEIGHT further down.
    baseRadius: 1,
    baseHeight: 1,
    buttonRadius: 1,
    buttonHeight: 0.41,
    // An optional safety margin on the gap-fill extension cylinder's radius, on top of it
    // already matching BUTTON_EXTERIOR's own measured radius exactly. A previous round found
    // that even though the extension's radius equals the exterior mesh's own measured
    // bottom-rim radius exactly (both 1.5 units), a real gap was visible from steep/low
    // camera angles ("I should not be able to see under the button") -- the exterior isn't a
    // flat-bottomed disc, its underside curves inward above the bottom rim, so a shallow
    // sightline grazes that curve before reaching the true bottom-rim radius. Widening this
    // margin (empirically: 30% left a visible sliver, 60% fully closed a deliberately steep
    // test angle) fixed that, but was then reported directly as a NEW, worse regression: "the
    // button extension should be the same diameter as the button exterior, not the base" --
    // even after clamping the widened radius to the base's own radius, the base (2.03125) is
    // itself wider than the exterior (1.5), so the extension still ended up visibly wider
    // than the button. Defaults to 1.0 (no widening, exact exterior match) so that regression
    // can't recur by default; the slider still exists for deliberately re-introducing the
    // under-button-gap trade-off later if wanted.
    extensionRadiusMargin: 1,
    clickIntensity: 0.56,
    heightGainPerClick: 0.5,
    holdThresholdMs: 250,
    releaseMs: 50,

    groundSize: 160,
    groundColor: "#22242c",
    baseColor: "#ff0000",
    buttonColor: "#d9363e",

    ambientIntensity: 0,
    directionalIntensity: 1.7,
    lightAngleX: -80,
    lightAngleY: -35,
    lightAngleZ: -77,

    cameraX: 120.30616050024554,
    cameraHeight: 133.10276053474442,
    cameraDistance: 90.82719320499793,
    cameraFov: 10,
    // Yaw/Pitch/Zoom, ported from OKCILCOKCID's camera architecture: DERIVED from
    // camera.position/controls.target (no independent state to restore), so they're NOT
    // replayed on boot/Reset/preset-restore (see applyAllSettings()'s skipCameraApply) --
    // force-overwriting them from a stored default would snap the real look direction to
    // whatever that default happens to mean, rather than leaving it alone. Kept here only so
    // Copy/Save Settings capture a live readout; their real values are refreshed every frame
    // regardless (see syncCameraSettingsFromLive(), called from animate()). Zoom (distance-
    // to-target) IS replayed normally like any other camera value; its default below is the
    // exact distance from the cameraX/Height/Distance position above to the origin target.
    cameraYaw: -124.24047329909014,
    cameraPitch: -40.208239776340264,
    cameraZoom: 200.87152442081072,

    cellShadingEnabled: true,
    toonBands: 8,
    toonShadowFloor: 0,
    toonHighlightCeiling: 100,

    outlineEnabled: true,
    // Default lowered from 0.21 -- at that thickness, the puffed-out geometry-outline shell
    // is large enough to self-intersect with the real mesh's own complex/concave features
    // (the base's non-flat underside, the step where the narrower cap sits on the wider
    // base) rather than staying a thin silhouette shell. Reported directly, with a
    // screenshot, as a light/white artifact appearing wherever two different parts'
    // outlines meet. Live A/B at the exact same camera angle confirmed: 0.21 reproduces a
    // jagged, lighter-colored crown of self-intersection artifacts around the base's
    // underside and at the cap/base shoulder corner; 0.05 removes it entirely; 0.1 also
    // removes it while staying clearly visible as an outline (checked at both a close 2-
    // button framing and the full default 14x14 grid). No code logic bug involved -- purely
    // a thickness-vs-geometry-complexity tradeoff; the slider remains available to go
    // thicker again if a future, less concave model doesn't need this headroom.
    outlineThickness: 0.1,
    outlineColor: "#000000",
    // Defaults to Geometry mode (false), not the screen-space OutlinePass. Directly reported,
    // repeatedly: base outline showing on top of the button, buttons missing their own outline,
    // and a stray light-colored artifact at the base/cap seam. Root cause: OutlinePass here runs
    // as 2 shared passes split by a checkerboard+base/cap-swap scheme (see makeOutlinePass()) to
    // keep it fast -- this guarantees the base-to-cap seam and orthogonal neighbors always land
    // in opposite passes, but DIAGONALLY-adjacent same-parity cells can still fall in the same
    // pass and their edges merge into one connected blob, which is what read as "no outline" /
    // "outline on top of" the wrong part. Live A/B at the same dense grid and camera angle
    // (2026-09-04/05) confirmed Geometry mode has zero merging and zero seam artifacts while
    // OutlinePass still showed both. A true fix for OutlinePass would need a 4-way (row%2,
    // col%2) split, which doubles the pass count back to 4 and reintroduces the lag this session
    // already fixed once -- not worth it when Geometry mode already works. The checkbox below
    // still switches back to OutlinePass for anyone who wants the screen-space look and can live
    // with the diagonal-merge limitation.
    outlineUsePostprocessing: false,
    // Separate from outlineThickness above -- that one puffs the geometry (inverted-hull)
    // outline meshes outward in local space (a scale factor), which has no meaning for the
    // screen-space pass; this maps directly to OutlinePass's own edgeThickness (screen-space
    // pixels, via its internal blur kernel radius), an entirely different unit/mechanism.
    outlinePassThickness: 2.4,
    // Strength/Glow, ported from the HANDO project's own OutlinePass slider set (that
    // project exposes edgeStrength/edgeGlow directly; this project previously hardcoded them
    // as constants in makeOutlinePass()). Defaults kept at this project's existing hardcoded
    // values (5/0) rather than HANDO's own (8/0), so turning these into sliders doesn't
    // silently change the current look -- only makes it tunable.
    outlinePassStrength: 10.5,
    outlinePassGlow: 0,
    // Runtime scale on top of the user's own baked outline shell (data/BUTTON OUTLINES.glb --
    // see bakedOutlineMat's own construction comment), so its thickness can be tuned live in
    // the dev panel instead of round-tripping through Blender every time. 0 = exactly the
    // authored shell, no extra scaling. Independent of outlineEnabled/outlineThickness above
    // -- those govern this project's own procedural outline techniques, not the baked one,
    // which stays visible regardless (see refreshOutlines()'s own comment on that).
    bakedOutlineThickness: 0,

    debugWireframe: false,
    debugHideBase: false,
    debugHideExterior: false,
    debugHideInterior: false,
    debugHideExtension: false,

    devTitleFontSize: 13,
    devTabFontSize: 11.5,
    devGroupTitleFontSize: 12,
    devSettingTitleFontSize: 12,
    devBodyFontSize: 12,
    devPanelOpacity: 0.92,
    devBgColor: "#0f1014",
    devTitleColor: "#9fd3ff",
    devTextColor: "#e6e6e6",

    _panelGeometryDesktop: { top: 12, left: 1236, width: 300, height: 560 },
    _panelGeometryMobile: null,
    _savedCameras: [
      { name: "Camera 1", cameraX: 70.98324539302234, cameraHeight: 56.63659455823262, cameraDistance: 59.45795162691757, cameraFov: 10, cameraZoom: 108.54295454495664 },
      { name: "Camera 2", cameraX: 45.66694552271302, cameraHeight: 45.05973764844779, cameraDistance: 48.21761575139796, cameraFov: 10, cameraZoom: 79.78904567047564 }
    ], // [{ name, cameraX, cameraHeight, cameraDistance, cameraFov, cameraZoom }] -- position+FOV+zoom only, no yaw/pitch/target (matches OKCILCOKCID: those are derived, not part of a preset's stored identity)
    _groupOrder: ["devpanel", "grid", "button", "lighting", "camera", "scene", "shading", "debug"],
    _itemOrderByGroup: {
      devpanel: ["devTitleFontSize", "devTabFontSize", "devGroupTitleFontSize", "devSettingTitleFontSize", "devBodyFontSize", "devPanelOpacity", "devBgColor", "devTitleColor", "devTextColor"],
      grid: ["colCount", "rowCount", "colSpacing", "rowSpacing", "rowXOffset", "cumulativeRowOffset"],
      button: ["baseRadius", "baseHeight", "buttonRadius", "buttonHeight", "extensionRadiusMargin", "clickIntensity", "heightGainPerClick", "holdThresholdMs", "releaseMs"],
      lighting: ["ambientIntensity", "directionalIntensity", "lightAngleX", "lightAngleY", "lightAngleZ"],
      camera: ["cameraX", "cameraHeight", "cameraDistance", "cameraFov", "cameraYaw", "cameraPitch", "cameraZoom"],
      scene: ["groundSize", "groundColor", "baseColor", "buttonColor"],
      shading: ["cellShadingEnabled", "toonBands", "toonShadowFloor", "toonHighlightCeiling", "outlineEnabled", "outlineUsePostprocessing", "outlineThickness", "outlineColor", "outlinePassThickness", "outlinePassStrength", "outlinePassGlow", "bakedOutlineThickness"],
      debug: ["debugWireframe", "debugHideBase", "debugHideExterior", "debugHideInterior", "debugHideExtension"]
    },
    _collapsedGroups: ["devpanel", "button", "lighting", "scene", "camera", "debug"]
  };

  var GROUP_DEFS = [
    { id: "devpanel", title: "Dev Panel" },
    { id: "grid", title: "Grid" },
    { id: "button", title: "Button" },
    { id: "lighting", title: "Lighting" },
    { id: "camera", title: "Camera" },
    { id: "scene", title: "Scene" },
    { id: "shading", title: "Shading" },
    { id: "debug", title: "Debug" }
  ];

  var SLIDER_CONFIG = [
    { key: "colCount", label: "Column Count", min: 1, max: 30, step: 1, unit: "", integer: true, regen: true },
    { key: "rowCount", label: "Row Count", min: 1, max: 30, step: 1, unit: "", integer: true, regen: true },
    { key: "colSpacing", label: "X Spacing (per button)", min: 0.5, max: 5, step: 0.05, unit: "(x)", regen: true },
    { key: "rowSpacing", label: "Y Spacing (per row)", min: 0.5, max: 5, step: 0.05, unit: "(x)", regen: true },
    { key: "rowXOffset", label: "X Offset (Row Stagger)", min: -2, max: 2, step: 0.01, unit: "(x)", regen: true },

    { key: "baseRadius", label: "Base Radius", min: 0.1, max: 2, step: 0.01, unit: "(x)", regen: true },
    { key: "baseHeight", label: "Base Height", min: 0.05, max: 1, step: 0.01, unit: "(x)", regen: true },
    { key: "buttonRadius", label: "Button Radius", min: 0.05, max: 2, step: 0.01, unit: "(x)", regen: true },
    { key: "extensionRadiusMargin", label: "Extension Radius Margin (vs. Button)", min: 1, max: 2.5, step: 0.05, unit: "(x)", regen: true },
    { key: "buttonHeight", label: "Button Resting Height", min: 0.05, max: 1.5, step: 0.01, unit: "(x)", regen: true },
    { key: "clickIntensity", label: "Click Press Depth", min: 0, max: 1, step: 0.005, unit: "(x)" },
    { key: "heightGainPerClick", label: "Height Gain Per Click", min: 0, max: 0.5, step: 0.002, unit: "(x)" },
    { key: "holdThresholdMs", label: "Hold Threshold (Reset)", min: 100, max: 2000, step: 50, unit: "(Ms)" },
    { key: "releaseMs", label: "Release Speed", min: 0, max: 1000, step: 10, unit: "(Ms)" },

    { key: "groundSize", label: "Ground Plane Size", min: 5, max: 400, step: 1, unit: "(x)", regen: true },

    { key: "ambientIntensity", label: "Ambient Light Intensity", min: 0, max: 2, step: 0.01, unit: "(x)", light: true },
    { key: "directionalIntensity", label: "Directional Light Intensity", min: 0, max: 3, step: 0.01, unit: "(x)", light: true },
    { key: "lightAngleX", label: "Light Angle X", min: -180, max: 180, step: 1, unit: "(Deg)", light: true },
    { key: "lightAngleY", label: "Light Angle Y", min: -180, max: 180, step: 1, unit: "(Deg)", light: true },
    { key: "lightAngleZ", label: "Light Angle Z", min: -180, max: 180, step: 1, unit: "(Deg)", light: true },

    { key: "cameraX", label: "Camera X Position", min: -100, max: 100, step: 0.1, unit: "(x)", camera: true },
    { key: "cameraHeight", label: "Camera Y Position", min: -100, max: 100, step: 0.1, unit: "(x)", camera: true },
    { key: "cameraDistance", label: "Camera Z Position", min: -150, max: 150, step: 0.1, unit: "(x)", camera: true },
    { key: "cameraFov", label: "Camera FOV", min: 20, max: 100, step: 1, unit: "(Deg)", camera: true },
    // Yaw/Pitch: ported from OKCILCOKCID -- a genuinely separate control from the X/Y/Z
    // position sliders above, which now translate position+target together (see
    // applyCameraControl()). These rotate controls.target around the CURRENT position at a
    // fixed distance instead -- a true "turn in place" independent of position and zoom.
    // replayOnLoad:false: derived state, must not be force-applied from a stored default
    // at boot/Reset/preset-restore (see applyAllSettings()).
    { key: "cameraYaw", label: "Camera Yaw", min: -180, max: 180, step: 1, unit: "(Deg)", camera: true, replayOnLoad: false },

  COLOR_CONFIG.forEach(function (cfg) { cfg.type = "color"; CONTROL_BY_KEY[cfg.key] = cfg; });

  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

  var LOCAL_KEY = "buttsons3dSettings";
  // Bumped whenever a setting's MEANING changes underneath its existing key (not just when
  // a new key/group is added -- the backfill below already handles that case safely). The
  // baseRadius/baseHeight/buttonRadius/buttonHeight switch from literal cylinder dimensions
  // to scale-relative-to-the-real-model factors is exactly this: an old saved 0.5 silently
  // meant something completely different afterward, badly mis-scaling/positioning the whole
  // scene with no error -- reported as "camera very far away, no buttons in sight, lighting
  // does nothing" (that last part being a downstream symptom: nothing lit was ever on
  // screen). A mismatched version discards the old save entirely rather than merging
  // semantically incompatible values. Bumped to 3 for the OKCILCOKCID camera-architecture
  // port: cameraTargetX/Y/Z (raw target coordinates) were removed in favor of derived
  // cameraYaw/cameraPitch/cameraZoom -- an old save's cameraTargetX/Y/Z would otherwise be
  // silently ignored (harmless) but its ABSENCE of cameraZoom would leave that key
  // undefined, and cameraX/Height/Distance under the old save may reflect a since-changed
  // "independent position, independent target" meaning rather than the new "position
  // translates target together" one.
  var SETTINGS_SCHEMA_VERSION = 3;
  function loadSavedDefaults() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      if (!raw) return deepClone(DEFAULT_SETTINGS);
      var parsed = JSON.parse(raw);
      if (parsed._schemaVersion !== SETTINGS_SCHEMA_VERSION) return deepClone(DEFAULT_SETTINGS);
      var merged = Object.assign(deepClone(DEFAULT_SETTINGS), parsed);
      // Backfill only -- a saved dump from before a slider/group existed silently
      // overwrites _groupOrder/_itemOrderByGroup wholesale via the shallow Object.assign
      // above (they're nested lists, not scalar values), hiding any newly-added group or
      // setting entirely even though its value/definition is present. Re-add anything
      // DEFAULT_SETTINGS has that the saved copy doesn't, preserving the user's own saved
      // order for everything that already existed.
      DEFAULT_SETTINGS._groupOrder.forEach(function (groupId) {
        if (merged._groupOrder.indexOf(groupId) === -1) merged._groupOrder.push(groupId);
      });
      Object.keys(DEFAULT_SETTINGS._itemOrderByGroup).forEach(function (groupId) {
        if (!merged._itemOrderByGroup[groupId]) {
          merged._itemOrderByGroup[groupId] = DEFAULT_SETTINGS._itemOrderByGroup[groupId].slice();
          return;
        }
        DEFAULT_SETTINGS._itemOrderByGroup[groupId].forEach(function (key) {
          if (merged._itemOrderByGroup[groupId].indexOf(key) === -1) {
            merged._itemOrderByGroup[groupId].push(key);
          }
        });
      });
      return merged;
    } catch (e) {
      return deepClone(DEFAULT_SETTINGS);
    }

  var settings = deepClone(savedDefaults);

  var devPanel = document.getElementById("devPanel");
  var groupsHost = document.getElementById("devGroups");
  var MOBILE_MEDIA_QUERY = matchMedia("(max-width: 767px)");

  function applyCssVar(cfg, value) {

  }

  // ---- Three.js scene ----
  var canvas = document.getElementById("sceneCanvas");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.shadowMap.enabled = false; // no shadows, per spec
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14151a);

  var camera = new THREE.PerspectiveCamera(settings.cameraFov, window.innerWidth / window.innerHeight, 0.1, 500);
  // Pre-positioned to exactly match the default cameraX/Height/Distance settings below,
  // ported from OKCILCOKCID's own construction (camera.position.set(0,0.5,9), matching that
  // project's own position-slider defaults exactly): applyCameraControl()'s position sliders
  // translate camera.position AND controls.target together by the delta from the camera's
  // CURRENT position, so if the camera started at THREE's own (0,0,0) default instead, the
  // very first settings replay at boot would compute a huge spurious delta and drag
  // controls.target to be coincident with camera.position -- a real degenerate "looking at
  // nothing, zero direction" camera. Starting here already at the right spot makes that
  // first replay's delta genuinely zero, exactly like OKCILCOKCID's own boot sequence.
  camera.position.set(settings.cameraX, settings.cameraHeight, settings.cameraDistance);

  // Mouse orbit/pan/zoom (replaces the old Camera Rotation X/Y/Z sliders entirely --
  // OrbitControls owns the camera's orientation from here on, updating camera.position/
  // .quaternion itself every frame based on drag/wheel input; the X/Y/Z Position sliders
  // still work too, translating position+target together -- see applyCameraControl()).
  var controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // Alternate outline technique: a screen-space postprocessing pass instead of the
  // default per-mesh inverted-hull child meshes (CLAUDE.md 12n debug/variant-toggle
  // pattern -- exposed as a checkbox, not a silent internal choice).
  //
  // TWO passes, not one: OutlinePass draws an edge wherever its own selection's mask
  // touches an UNselected pixel -- it has no way to tell two different SELECTED objects
  // apart. A single shared selectedObjects array (an earlier version of this had exactly
  // one) merges any two cells whose silhouettes touch on screen into one combined outline
  // with no seam between them -- visible as long connected wavy lines running along whole
  // rows of buttons, reported directly by the user.
  //
  // Direct measurement (gl.finish()-synchronized timing around composer.render(), isolating
  // each pass's own cost by toggling .enabled) found each OutlinePass instance costs a
  // near-constant ~40ms per frame in this dev environment REGARDLESS of how many objects it
  // selects -- OutlinePass's own internal machinery (mask/depth render, edge detection,
  // 2-stage separable blur, overlay composite -- several render-target switches per pass) is
  // fixed per-pass overhead, not scene-complexity-driven (measured 4/43/83/124ms for 0/1/2/4
  // enabled passes -- almost exactly linear). A 4-pass version of this fix (base and cap each
  // split into their own checkerboard pair) caused a real, reported "very very laggy"
  // regression for exactly this reason.
  //
  // 2026-09-06: bumped to 3 passes as a deliberate, measured experiment (user: "make it three
  // passes and see how that is") -- 2 was the previous ceiling, 4 was confirmed too slow, 3
  // was never actually measured. Re-measured fresh with this exact change, same gl.finish()
  // methodology, default 14x14 grid: 3 separate runs of 60 frames each gave per-pass-count
  // totals of 7.65/16.4/22.1/29.8ms, 8.8/21.4/30.0/46.4ms, and 4.9/20.2/29.1/38.0ms for 0/1/2/3
  // enabled passes -- i.e. full-3-pass frame cost measured between 29.8ms and 46.4ms across
  // the 3 runs (real range, not averaged), noticeably noisier AND substantially lower than the
  // ~40ms/pass, ~83ms-at-2-passes figures documented above from earlier this session. Neither
  // number is fabricated -- both are real measurements from the same technique on the same
  // machine, just at different points in the session; the discrepancy itself is not explained
  // (possibly a different GPU/driver/thermal state, tab history, or something about this
  // specific build -- not independently investigated further, this experiment's actual point
  // was the 3-vs-2 comparison, not resolving why the absolute baseline moved). At this newly-
  // measured scale, 2-pass (~22-30ms) and 3-pass (~30-46ms) are both far under the old
  // 4-pass figure (124ms) that was reported "very very laggy" -- 3 passes reads as a real,
  // affordable step up from 2, not a return to the rejected 4-pass regression. IMPORTANT,
  // worked out on paper before writing any code: 3 passes
  // CANNOT achieve full separation of every touching pair -- properly coloring a grid so that
  // no two orthogonally- OR diagonally-adjacent cells share a color needs 4 colors minimum
  // (a basic graph-coloring fact, not a bug). So this is a partial improvement over 2 passes,
  // not a complete fix for the known diagonal-merge/cross-instance limitations documented
  // below and at the pass-assignment site in regenerateGrid().
  //
  // Within that pass budget, regenerateGrid() assigns each cell's meshes by a 3-way cellColor
  // AND a base-vs-cap rotation: a cell's base and its own cap (exterior+interior+extension)
  // always land in DIFFERENT passes, and which 2 of the 3 passes flips with cellColor. Working
  // through what that guarantees (worked out by hand, not verified by exhaustive testing of
  // every cell pair):
  //  - A cell's own base and cap are ALWAYS in different passes -> base-to-cap seam always
  //    renders, satisfying "the button should have its own outline and so should the base."
  //  - Two orthogonally-adjacent cells' SAME-type meshes (base-vs-neighbor's-base, or
  //    cap-vs-neighbor's-cap) are always in different passes too -> the original cross-button
  //    row-merging bug stays fixed (confirmed true for all 8 orthogonal parity transitions).
  //  - Diagonally-adjacent cells' SAME-type meshes: FIXED for roughly half of all cells (where
  //    row%2 != col%2) -- their diagonal neighbors always land in a genuinely different pass.
  //    STILL MERGED for the other half (where row%2 == col%2, i.e. both-even or both-odd
  //    cells) -- those diagonal neighbors land in the same pass as before, unchanged from the
  //    2-pass version. This is the direct, unavoidable consequence of only having 3 colors for
  //    what needs 4 -- not a partial bug, a fully-understood partial fix.
  //  - A cell's base vs. an orthogonally-adjacent neighbor's cap (the OTHER known limitation,
  //    reported directly as pink/purple arrows, 2026-09-05): checked by hand for all 8
  //    orthogonal parity-transition cases under the new 3-color scheme -- 4 of 8 came out
  //    separated, 4 did not, no cleaner pattern than "roughly half." Net exposure to this
  //    specific edge case is NOT meaningfully better or worse than the 2-pass version; this
  //    change wasn't targeted at it (the diagonal same-type case above, called out directly as
  //    "much more severe than estimated," was the actual target). Fully separating every
  //    touching pair (orthogonal AND diagonal, base AND cap, all at once) needs more distinct
  //    pass groups than 3 -- not attempted, since 4 was already measured "very very laggy" and
  //    the real number for anything above 3 hasn't been re-measured.
  //
  // KNOWN, UNRESOLVED LIMITATION -- corner artifact where 2 different parts' outlines meet:
  // reported directly (green arrows, 2026-09-05) as a light/white notch exactly where a cap's
  // own outline and its base's own outline meet at the shoulder corner. Confirmed real via
  // live A/B against a lighter ground color (the notch reads as a near-background-color gap,
  // not a rendering mistake specific to the dark default). Root-caused what it is NOT: not
  // fixable by raising outlinePassThickness/outlinePassStrength to their max (tested both,
  // no visible change) -- so it isn't a plain "line too thin" issue; not caused by extMesh's
  // own gap-filling role either (tried giving the gap a dedicated always-selected helper mesh,
  // reverted -- OutlinePass ignores invisible objects entirely, and at rest capGroup sits
  // exactly at baseTop anyway, so there's no real 3D gap there to fill). Most likely cause,
  // NOT independently confirmed: base and cap are 2 DIFFERENT OutlinePass instances, each
  // running its own fully independent mask-render -> edge-detect -> blur -> overlay pipeline
  // with zero awareness of the other's geometry; at the exact screen pixels where their 2
  // silhouettes are meant to meet seamlessly, 2 separately-rasterized/anti-aliased edges can
  // leave a sub-pixel gap that no amount of blur radius or strength closes, because there's
  // nothing to dilate FROM at that exact texel in either pass's own mask. A real fix would
  // need the seam to be drawn as one continuous edge understood by a single pass, which
  // conflicts with the checkerboard scheme's whole reason for using 2 passes (giving base and
  // cap SEPARATE outlines at all -- put them in the same pass and the seam disappears
  // entirely instead, the original bug this session's 2nd round fixed). Not resolved this
  // round; the geometry (inverted-hull) outline technique has neither this nor the
  // cross-instance limitation above, confirmed via live A/B testing 2 rounds prior.
  var composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  function makeOutlinePass() {
    var pass = new OutlinePass(new THREE.Vector2(window.innerWidth || 1, window.innerHeight || 1), scene, camera);
    pass.edgeStrength = settings.outlinePassStrength; // kept in sync by refreshOutlines()
    pass.edgeGlow = settings.outlinePassGlow;
    pass.edgeThickness = settings.outlinePassThickness;
    pass.hiddenEdgeColor.set(0x000000);
    // OutlinePass composites its edge color with THREE.AdditiveBlending by default, which
    // makes a black outlineColor (this project's default -- CLAUDE.md matches the geometry
    // outline's own flat black) a no-op: adding (0,0,0) to the scene changes nothing, so the
    // edge was rendered but invisible. Normal (alpha) blending composites correctly for any
    // edge color, including black.
    pass.overlayMaterial.blending = THREE.NormalBlending;
    // An EARLIER round tried to suppress "hidden" (occluded-by-other-geometry) edges by
    // forcing their alpha to 0 in edgeDetectionMaterial, based on OutlinePass's own
    // depth-vs-real-scene comparison (prepareMaskMaterial: a selected fragment's depth
    // against a depth buffer of everything NOT in this pass's selection). That comparison
    // turned out to be unreliable for this scene: verified directly (isolated a single,
    // fully unoccluded button with nothing else in the grid, then forced the depth-test
    // result to a constant "always visible" and watched the button's own top-rim outline
    // reappear) that OutlinePass was misclassifying a plainly VISIBLE silhouette edge
    // (against empty background, not against any real occluder) as "hidden" -- silently
    // eating real, wanted outline. This is a strong candidate for also explaining "weird
    // clipping/blending" reported while rotating: a depth-test that's already unreliable at
    // rest would be expected to flicker between hidden/visible as the viewing angle changes.
    // Rather than continue chasing the exact numeric cause inside OutlinePass's own
    // HalfFloat depth-packing (time-costly and still speculative), removed the hidden/visible
    // distinction entirely: every detected edge now draws at full strength, unconditionally.
    // This gives up the narrower case the depth-test was meant to catch (an outline drawing
    // through something ACTUALLY in front of it) in favor of the outline reliably existing at
    // all -- and given the checkerboard/base-cap-swap scheme already keeps most genuinely
    // touching neighbors in separate passes (so a "hidden" classification between them was
    // usually wrong anyway, per this same finding), the trade is a clear net win here.
    pass.edgeDetectionMaterial.fragmentShader =
      "varying vec2 vUv;\n" +
      "uniform sampler2D maskTexture;\n" +
      "uniform vec2 texSize;\n" +
      "uniform vec3 visibleEdgeColor;\n" +
      "uniform vec3 hiddenEdgeColor;\n" +
      "void main() {\n" +
      "  vec2 invSize = 1.0 / texSize;\n" +
      "  vec4 uvOffset = vec4(1.0, 0.0, 0.0, 1.0) * vec4(invSize, invSize);\n" +
      "  vec4 c1 = texture2D(maskTexture, vUv + uvOffset.xy);\n" +
      "  vec4 c2 = texture2D(maskTexture, vUv - uvOffset.xy);\n" +
      "  vec4 c3 = texture2D(maskTexture, vUv + uvOffset.yw);\n" +
      "  vec4 c4 = texture2D(maskTexture, vUv - uvOffset.yw);\n" +
      "  float diff1 = (c1.r - c2.r) * 0.5;\n" +
      "  float diff2 = (c3.r - c4.r) * 0.5;\n" +
      "  float d = length(vec2(diff1, diff2));\n" +
      "  gl_FragColor = vec4(visibleEdgeColor, 1.0) * vec4(d);\n" +
      "}\n";
    pass.edgeDetectionMaterial.needsUpdate = true;
    composer.addPass(pass);
    return pass;
  }
  var outlinePassA = makeOutlinePass();
  var outlinePassB = makeOutlinePass();
  var outlinePassC = makeOutlinePass();
  var ALL_OUTLINE_PASSES = [outlinePassA, outlinePassB, outlinePassC];
