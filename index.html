<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buttsons3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: var(--app-bg-color);
  }
  :root {
    --app-bg-color: #14151a;
    --dev-title-font-size: 13px;
    --dev-tab-font-size: 11.5px;
    --dev-group-title-font-size: 12px;
    --dev-setting-title-font-size: 12px;
    --dev-body-font-size: 12px;
    --dev-panel-opacity: 0.92;
    --dev-bg-color: #0f1014;
    --dev-title-color: #9fd3ff;
    --dev-text-color: #e6e6e6;
  }
  #sceneCanvas {
    position: fixed;
    inset: 0;
    display: block;
  }

  /* ---- Dev panel (mechanics ported from the BUTTSONS project's own dev panel) ---- */
  body:not(.dev-enabled) #devPanel { display: none !important; }
  body.dev-hidden #devPanel { display: none !important; }

  #devPanel {
    position: fixed;
    display: flex;
    flex-direction: column;
    background: var(--dev-bg-color);
    opacity: var(--dev-panel-opacity);
    border: 1px solid #333a4a;
    border-radius: 6px;
    color: var(--dev-text-color);
    font: var(--dev-body-font-size)/1.4 system-ui, sans-serif;
    z-index: 1000;
    min-width: 260px;
    min-height: 160px;
    overflow: hidden;
  }
  #devPanel.collapsed .dev-body { display: none; }
  #devPanel .dev-titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    cursor: move;
    background: #1c1e24;
    user-select: none;
  }
  #devPanel .dev-title {
    font-size: var(--dev-title-font-size);
    font-weight: 700;
    color: var(--dev-title-color);
  }
  #devPanel .dev-collapse-btn {
    background: none;
    border: none;
    color: var(--dev-text-color);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 6px;
  }
  #devPanel .dev-body {
    display: flex;
    flex-direction: column;
    min-height: 0;
    flex: 1;
  }
  .dev-tabs {
    display: flex;
    border-bottom: 1px solid #262932;
  }
  .dev-tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--dev-text-color);
    font-size: var(--dev-tab-font-size);
    padding: 6px 0;
    cursor: pointer;
    opacity: 0.6;
  }
  #devPanel.tab-desktop .dev-tab-btn[data-tab="desktop"],
  #devPanel.tab-mobile .dev-tab-btn[data-tab="mobile"] {
    opacity: 1;
    border-bottom: 2px solid var(--dev-title-color);
  }
  .dev-actions {
    display: flex;
    gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid #262932;
  }
  .dev-actions button {
    flex: 1;
    background: #262932;
    border: 1px solid #333a4a;
    color: var(--dev-text-color);
    border-radius: 4px;
    padding: 5px 0;
    cursor: pointer;
    font-size: var(--dev-body-font-size);
  }
  .dev-actions button:hover { background: #33374a; }
  #devSaveStatus {
    padding: 0 8px 4px;
    font-size: 10px;
    opacity: 0.6;
  }
  #devGroups {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .dev-group.dragging-item { opacity: 0.4; }
  .dev-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: #1c1e24;
    cursor: pointer;
    user-select: none;
  }
  .dev-group-header .drag-grip { cursor: grab; opacity: 0.5; }
  .dev-group-title {
    font-size: var(--dev-group-title-font-size);
    font-weight: 600;
    flex: 1;
  }
  .dev-group-caret { opacity: 0.6; font-size: 10px; }
  .dev-group.collapsed .dev-group-body { display: none; }
  .dev-group-body { padding: 6px 8px; }
  .dev-tab-desktop, .dev-tab-mobile { display: none !important; }
  #devPanel.tab-desktop .dev-tab-desktop,
  #devPanel.tab-mobile .dev-tab-mobile { display: flex !important; }
  .dev-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
  }
  .dev-row.dragging-item { opacity: 0.4; }
  .dev-row .drag-grip { cursor: grab; opacity: 0.4; font-size: 10px; }
  .dev-row-main { flex: 1; min-width: 0; }
  .dev-setting-label {
    font-size: var(--dev-setting-title-font-size);
    display: block;
    margin-bottom: 2px;
  }
  .dev-controls { display: flex; align-items: center; gap: 6px; }
  .dev-controls input[type="range"] { flex: 1; min-width: 0; }
  .dev-value {
    font-size: var(--dev-body-font-size);
    min-width: 3.5em;
    text-align: right;
    cursor: text;
    padding: 1px 3px;
    border-radius: 3px;
  }
  .dev-value:hover { background: rgba(255,255,255,0.08); }
  .dev-value input {
    width: 4.5em;
    background: #000;
    color: var(--dev-text-color);
    border: 1px solid #444;
    font: inherit;
  }
  .dev-color-row input[type="color"] {
    width: 28px;
    height: 22px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
  }
  .dev-checkbox-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  /* Resize/move hit zones */
  .dev-resize-edge { position: absolute; z-index: 2; }
  .dev-resize-edge.n { top: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
  .dev-resize-edge.s { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
  .dev-resize-edge.e { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
  .dev-resize-edge.w { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
  .dev-resize-corner { position: absolute; z-index: 3; width: 10px; height: 10px; }
  .dev-resize-corner.nw { top: -3px; left: -3px; cursor: nwse-resize; }
  .dev-resize-corner.ne { top: -3px; right: -3px; cursor: nesw-resize; }
  .dev-resize-corner.sw { bottom: -3px; left: -3px; cursor: nesw-resize; }
  .dev-resize-corner.se { bottom: -3px; right: -3px; cursor: nwse-resize; }
</style>
</head>
<body>

<canvas id="sceneCanvas"></canvas>

<div id="devPanel">
  <div class="dev-resize-edge n"></div>
  <div class="dev-resize-edge s"></div>
  <div class="dev-resize-edge e"></div>
  <div class="dev-resize-edge w"></div>
  <div class="dev-resize-corner nw"></div>
  <div class="dev-resize-corner ne"></div>
  <div class="dev-resize-corner sw"></div>
  <div class="dev-resize-corner se"></div>
  <div class="dev-titlebar">
    <span class="dev-title">DEV</span>
    <button class="dev-collapse-btn" id="devCollapseBtn" title="Collapse">&#9650;</button>
  </div>
  <div class="dev-body">
    <div class="dev-tabs">
      <button class="dev-tab-btn" data-tab="desktop">Desktop</button>
      <button class="dev-tab-btn" data-tab="mobile">Mobile</button>
    </div>
    <div class="dev-actions">
      <button id="btnCopy">Copy Settings</button>
      <button id="btnSave">Save Settings</button>
      <button id="btnReset">Reset</button>
    </div>
    <div id="devSaveStatus">Local-only for now -- git-tracked sync not wired up yet for this project.</div>
    <div id="devGroups"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

(function () {
  "use strict";

  // ---- Dev gating (CLAUDE.md 12b) ----
  function isDevAllowed() {
    var h = location.hostname;
    if (h === "localhost" || h === "127.0.0.1" || location.protocol === "file:") return true;
    try {
      return new URLSearchParams(location.search).get("dev") === "1";
    } catch (e) {
      return /[?&]dev=1(&|$)/.test(location.search);
    }
  }
  if (isDevAllowed()) {
    document.body.classList.add("dev-enabled");
  }

  // ---- Settings ----
  // A throwaway camera, positioned/aimed the same way the scene's real default view
  // used to be set up (via lookAt) before rotation became independently slider-driven --
  // read back as Euler degrees so the rotation sliders start at a look that matches the
  // old lookAt-based default, instead of a guessed literal.
  var _defaultCam = new THREE.PerspectiveCamera();
  _defaultCam.position.set(0, 28, 36);
  _defaultCam.lookAt(0, 0, 0);
  var _defaultCamRotDeg = {
    x: THREE.MathUtils.radToDeg(_defaultCam.rotation.x),
    y: THREE.MathUtils.radToDeg(_defaultCam.rotation.y),
    z: THREE.MathUtils.radToDeg(_defaultCam.rotation.z)
  };

  var DEFAULT_SETTINGS = {
    colCount: 8,
    rowCount: 5,
    colSpacing: 1.4,
    rowSpacing: 1.4,
    rowXOffset: 0,
    cumulativeRowOffset: false,

    // baseRadius/baseHeight/buttonRadius/buttonHeight are SCALE FACTORS (1.0 = the real
    // model's own authored size) now that the button is real geometry (data/BUTTON
    // MODEL.fbx), not a resizable procedural cylinder -- see NATURAL_BASE_RADIUS/
    // NATURAL_BASE_HEIGHT further down.
    baseRadius: 1,
    baseHeight: 1,
    buttonRadius: 1,
    buttonHeight: 1,
    extensionRadius: 0.9,
    clickIntensity: 0.3,
    heightGainPerClick: 0.12,
    holdThresholdMs: 500,
    releaseMs: 180,

    groundSize: 160,
    groundColor: "#22242c",
    baseColor: "#3a3f4c",
    buttonColor: "#d9363e",

    ambientIntensity: 0.5,
    directionalIntensity: 1.2,
    lightAngleX: -40,
    lightAngleY: 30,
    lightAngleZ: 0,

    cameraX: 0,
    cameraHeight: 28,
    cameraDistance: 36,
    cameraFov: 45,
    cameraRotX: Math.round(_defaultCamRotDeg.x * 100) / 100,
    cameraRotY: Math.round(_defaultCamRotDeg.y * 100) / 100,
    cameraRotZ: Math.round(_defaultCamRotDeg.z * 100) / 100,

    cellShadingEnabled: false,
    toonBands: 4,
    toonShadowFloor: 25,
    toonHighlightCeiling: 100,

    debugWireframe: false,

    devTitleFontSize: 13,
    devTabFontSize: 11.5,
    devGroupTitleFontSize: 12,
    devSettingTitleFontSize: 12,
    devBodyFontSize: 12,
    devPanelOpacity: 0.92,
    devBgColor: "#0f1014",
    devTitleColor: "#9fd3ff",
    devTextColor: "#e6e6e6",

    _panelGeometryDesktop: null,
    _panelGeometryMobile: null,
    _groupOrder: ["devpanel", "grid", "button", "lighting", "camera", "scene", "shading", "debug"],
    _itemOrderByGroup: {
      devpanel: ["devTitleFontSize", "devTabFontSize", "devGroupTitleFontSize", "devSettingTitleFontSize", "devBodyFontSize", "devPanelOpacity", "devBgColor", "devTitleColor", "devTextColor"],
      grid: ["colCount", "rowCount", "colSpacing", "rowSpacing", "rowXOffset", "cumulativeRowOffset"],
      button: ["baseRadius", "baseHeight", "buttonRadius", "buttonHeight", "extensionRadius", "clickIntensity", "heightGainPerClick", "holdThresholdMs", "releaseMs"],
      lighting: ["ambientIntensity", "directionalIntensity", "lightAngleX", "lightAngleY", "lightAngleZ"],
      camera: ["cameraX", "cameraHeight", "cameraDistance", "cameraFov", "cameraRotX", "cameraRotY", "cameraRotZ"],
      scene: ["groundSize", "groundColor", "baseColor", "buttonColor"],
      shading: ["cellShadingEnabled", "toonBands", "toonShadowFloor", "toonHighlightCeiling"],
      debug: ["debugWireframe"]
    },
    _collapsedGroups: ["devpanel"]
  };

  var GROUP_DEFS = [
    { id: "devpanel", title: "Dev Panel" },
    { id: "grid", title: "Grid" },
    { id: "button", title: "Button" },
    { id: "lighting", title: "Lighting" },
    { id: "camera", title: "Camera" },
    { id: "scene", title: "Scene" },
    { id: "shading", title: "Shading" },
    { id: "debug", title: "Debug" }
  ];

  var SLIDER_CONFIG = [
    { key: "colCount", label: "Column Count", min: 1, max: 30, step: 1, unit: "", integer: true, regen: true },
    { key: "rowCount", label: "Row Count", min: 1, max: 30, step: 1, unit: "", integer: true, regen: true },
    { key: "colSpacing", label: "X Spacing (per button)", min: 0.5, max: 5, step: 0.05, unit: "(x)", regen: true },
    { key: "rowSpacing", label: "Y Spacing (per row)", min: 0.5, max: 5, step: 0.05, unit: "(x)", regen: true },
    { key: "rowXOffset", label: "X Offset (Row Stagger)", min: -2, max: 2, step: 0.01, unit: "(x)", regen: true },

    { key: "baseRadius", label: "Base Radius", min: 0.1, max: 2, step: 0.01, unit: "(x)", regen: true },
    { key: "baseHeight", label: "Base Height", min: 0.05, max: 1, step: 0.01, unit: "(x)", regen: true },
    { key: "buttonRadius", label: "Button Radius", min: 0.05, max: 2, step: 0.01, unit: "(x)", regen: true },
    { key: "buttonHeight", label: "Button Resting Height", min: 0.05, max: 1.5, step: 0.01, unit: "(x)", regen: true },
    { key: "extensionRadius", label: "Extension (Gap-Fill) Radius", min: 0.02, max: 2, step: 0.01, unit: "(x)", regen: true },
    { key: "clickIntensity", label: "Click Press Depth", min: 0, max: 1, step: 0.005, unit: "(x)" },
    { key: "heightGainPerClick", label: "Height Gain Per Click", min: 0, max: 0.5, step: 0.002, unit: "(x)" },
    { key: "holdThresholdMs", label: "Hold Threshold (Reset)", min: 100, max: 2000, step: 50, unit: "(Ms)" },
    { key: "releaseMs", label: "Release Speed", min: 0, max: 1000, step: 10, unit: "(Ms)" },

    { key: "groundSize", label: "Ground Plane Size", min: 5, max: 400, step: 1, unit: "(x)", regen: true },

    { key: "ambientIntensity", label: "Ambient Light Intensity", min: 0, max: 2, step: 0.01, unit: "(x)", light: true },
    { key: "directionalIntensity", label: "Directional Light Intensity", min: 0, max: 3, step: 0.01, unit: "(x)", light: true },
    { key: "lightAngleX", label: "Light Angle X", min: -180, max: 180, step: 1, unit: "(Deg)", light: true },
    { key: "lightAngleY", label: "Light Angle Y", min: -180, max: 180, step: 1, unit: "(Deg)", light: true },
    { key: "lightAngleZ", label: "Light Angle Z", min: -180, max: 180, step: 1, unit: "(Deg)", light: true },

    { key: "cameraX", label: "Camera X Position", min: -100, max: 100, step: 0.1, unit: "(x)", camera: true },
    { key: "cameraHeight", label: "Camera Y Position", min: -100, max: 100, step: 0.1, unit: "(x)", camera: true },
    { key: "cameraDistance", label: "Camera Z Position", min: -150, max: 150, step: 0.1, unit: "(x)", camera: true },
    { key: "cameraFov", label: "Camera FOV", min: 20, max: 100, step: 1, unit: "(Deg)", camera: true },
    { key: "cameraRotX", label: "Camera Rotation X", min: -180, max: 180, step: 0.5, unit: "(Deg)", camera: true },
    { key: "cameraRotY", label: "Camera Rotation Y", min: -180, max: 180, step: 0.5, unit: "(Deg)", camera: true },
    { key: "cameraRotZ", label: "Camera Rotation Z", min: -180, max: 180, step: 0.5, unit: "(Deg)", camera: true },

    { key: "toonBands", label: "Toon Shading Bands", min: 2, max: 8, step: 1, unit: "", integer: true, material: true },
    { key: "toonShadowFloor", label: "Toon Shadow Floor Brightness", min: 0, max: 100, step: 1, unit: "%", material: true },
    { key: "toonHighlightCeiling", label: "Toon Highlight Ceiling Brightness", min: 0, max: 100, step: 1, unit: "%", material: true },

    { key: "devTitleFontSize", label: "Dev Panel Title Font Size", min: 8, max: 24, step: 0.5, unit: "px", cssVar: "--dev-title-font-size" },
    { key: "devTabFontSize", label: "Desktop/Mobile Tab Font Size", min: 8, max: 24, step: 0.5, unit: "px", cssVar: "--dev-tab-font-size" },
    { key: "devGroupTitleFontSize", label: "Collapsible Group Title Font Size", min: 8, max: 24, step: 0.5, unit: "px", cssVar: "--dev-group-title-font-size" },
    { key: "devSettingTitleFontSize", label: "Settings Title Font Size", min: 8, max: 24, step: 0.5, unit: "px", cssVar: "--dev-setting-title-font-size" },
    { key: "devBodyFontSize", label: "Body Text Font Size", min: 8, max: 24, step: 0.5, unit: "px", cssVar: "--dev-body-font-size" },
    { key: "devPanelOpacity", label: "Dev Panel Opacity", min: 0.1, max: 1, step: 0.01, unit: "", cssVar: "--dev-panel-opacity" }
  ];

  var CHECKBOX_CONFIG = [
    { key: "cumulativeRowOffset", label: "Cumulative Row Offset (each row shifts further than the last, instead of alternating)", regen: true },
    { key: "cellShadingEnabled", label: "Cell (Toon) Shading", material: true },
    { key: "debugWireframe", label: "Wireframe", material: true }
  ];

  var COLOR_CONFIG = [
    { key: "groundColor", label: "Ground Color", scene: true },
    { key: "baseColor", label: "Base Color", material: true },
    { key: "buttonColor", label: "Button Color", material: true },
    { key: "devBgColor", label: "Dev Panel Background Color", cssVar: "--dev-bg-color" },
    { key: "devTitleColor", label: "Dev Panel Title Text Color", cssVar: "--dev-title-color" },
    { key: "devTextColor", label: "Dev Panel Non-Title Text Color", cssVar: "--dev-text-color" }
  ];

  var CONTROL_BY_KEY = {};
  SLIDER_CONFIG.forEach(function (cfg) { cfg.type = "slider"; CONTROL_BY_KEY[cfg.key] = cfg; });
  CHECKBOX_CONFIG.forEach(function (cfg) { cfg.type = "checkbox"; CONTROL_BY_KEY[cfg.key] = cfg; });
  COLOR_CONFIG.forEach(function (cfg) { cfg.type = "color"; CONTROL_BY_KEY[cfg.key] = cfg; });

  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

  var LOCAL_KEY = "buttsons3dSettings";
  function loadSavedDefaults() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      if (!raw) return deepClone(DEFAULT_SETTINGS);
      var parsed = JSON.parse(raw);
      var merged = Object.assign(deepClone(DEFAULT_SETTINGS), parsed);
      // Backfill only -- a saved dump from before a slider/group existed silently
      // overwrites _groupOrder/_itemOrderByGroup wholesale via the shallow Object.assign
      // above (they're nested lists, not scalar values), hiding any newly-added group or
      // setting entirely even though its value/definition is present. Re-add anything
      // DEFAULT_SETTINGS has that the saved copy doesn't, preserving the user's own saved
      // order for everything that already existed.
      DEFAULT_SETTINGS._groupOrder.forEach(function (groupId) {
        if (merged._groupOrder.indexOf(groupId) === -1) merged._groupOrder.push(groupId);
      });
      Object.keys(DEFAULT_SETTINGS._itemOrderByGroup).forEach(function (groupId) {
        if (!merged._itemOrderByGroup[groupId]) {
          merged._itemOrderByGroup[groupId] = DEFAULT_SETTINGS._itemOrderByGroup[groupId].slice();
          return;
        }
        DEFAULT_SETTINGS._itemOrderByGroup[groupId].forEach(function (key) {
          if (merged._itemOrderByGroup[groupId].indexOf(key) === -1) {
            merged._itemOrderByGroup[groupId].push(key);
          }
        });
      });
      return merged;
    } catch (e) {
      return deepClone(DEFAULT_SETTINGS);
    }
  }

  var savedDefaults = loadSavedDefaults();
  var settings = deepClone(savedDefaults);

  var root = document.documentElement;
  var devPanel = document.getElementById("devPanel");
  var groupsHost = document.getElementById("devGroups");
  var MOBILE_MEDIA_QUERY = matchMedia("(max-width: 767px)");
  function isMobileActive() { return MOBILE_MEDIA_QUERY.matches; }

  function applyCssVar(cfg, value) {
    if (cfg.cssVar) root.style.setProperty(cfg.cssVar, value);
  }

  // ---- Three.js scene ----
  var canvas = document.getElementById("sceneCanvas");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.shadowMap.enabled = false; // no shadows, per spec
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14151a);

  var camera = new THREE.PerspectiveCamera(settings.cameraFov, window.innerWidth / window.innerHeight, 0.1, 500);

  // Directional + ambient light, always both present (no longer tied to the cell-shading
  // toggle) -- real lit shading so a cylinder's top face and side faces read as visibly
  // different surfaces, same as the 2D project's painted-shading look. Shadows stay off
  // throughout: renderer.shadowMap.enabled is false above, and neither light nor any mesh
  // ever sets castShadow/receiveShadow, so this is lit-but-shadowless by construction.
  var ambientLight = new THREE.AmbientLight(0xffffff, settings.ambientIntensity);
  scene.add(ambientLight);
  var directionalLight = new THREE.DirectionalLight(0xffffff, settings.directionalIntensity);
  scene.add(directionalLight);
  scene.add(directionalLight.target);

  function applyLightSettings() {
    ambientLight.intensity = settings.ambientIntensity;
    directionalLight.intensity = settings.directionalIntensity;
    var dir = new THREE.Vector3(0, 1, 0.35);
    var euler = new THREE.Euler(
      THREE.MathUtils.degToRad(settings.lightAngleX),
      THREE.MathUtils.degToRad(settings.lightAngleY),
      THREE.MathUtils.degToRad(settings.lightAngleZ)
    );
    dir.applyEuler(euler).normalize();
    directionalLight.position.copy(dir).multiplyScalar(12);
    directionalLight.target.position.set(0, 0, 0);
    directionalLight.target.updateMatrixWorld();
  }

  var groundGeo = new THREE.PlaneGeometry(1, 1);
  var groundMat = new THREE.MeshBasicMaterial({ color: settings.groundColor });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  function buildGradientMap(bands, floorPct, ceilPct) {
    var size = Math.max(2, Math.round(bands));
    var data = new Uint8Array(size);
    var floor = Math.round((floorPct / 100) * 255);
    var ceil = Math.round((ceilPct / 100) * 255);
    for (var i = 0; i < size; i++) {
      var t = size === 1 ? 1 : i / (size - 1);
      data[i] = Math.max(0, Math.min(255, Math.round(floor + t * (ceil - floor))));
    }
    var tex = new THREE.DataTexture(data, size, 1, THREE.RedFormat);
    tex.needsUpdate = true;
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    return tex;
  }

  // Non-toon default is MeshLambertMaterial (not MeshBasicMaterial) specifically so it
  // responds to the lights above -- MeshBasicMaterial ignores lighting entirely and would
  // render every face the same flat color regardless of the directional light, which is
  // exactly the top-vs-side indistinguishability this was built to avoid.
  function makeMaterial(colorHex) {
    if (settings.cellShadingEnabled) {
      return new THREE.MeshToonMaterial({
        color: colorHex,
        gradientMap: buildGradientMap(settings.toonBands, settings.toonShadowFloor, settings.toonHighlightCeiling),
        wireframe: settings.debugWireframe
      });
    }
    return new THREE.MeshLambertMaterial({ color: colorHex, wireframe: settings.debugWireframe });
  }

  var baseMat = makeMaterial(settings.baseColor);
  var buttonMat = makeMaterial(settings.buttonColor);

  // The real Rhino-modeled button (data/BUTTON MODEL.fbx) replaces the placeholder
  // cylinders: 4 named parts -- BUTTON_BASE, BUTTON_EXTERIOR (the always-visible outer
  // shell), and a BUTTON_INTERIOR_-_UNPRESSED/_PRESSED pair (the convex/concave swap
  // discussed earlier, toggled by visibility on press same as the 2D project's own
  // dome-up/dome-pressed swap). Authored Z-up (Rhino's convention) -- rotateX(-90deg)
  // once, baked into the geometry, converts each part to this scene's Y-up frame so
  // nothing downstream needs to think about the source coordinate system again. Radius
  // ~2.03 and height 1 for the base (see NATURAL_BASE_* below) are the model's own real
  // proportions -- the size sliders scale relative to that authored size (1.0 = as
  // modeled), not literal world units, since this is a fixed shape, not a resizable
  // primitive.
  var NATURAL_BASE_RADIUS = 2.03125;
  var NATURAL_BASE_HEIGHT = 1;
  var modelGeo = { base: null, exterior: null, unpressed: null, pressed: null };
  var modelReady = false;

  function extractGeo(root, groupName) {
    var groupObj = root.getObjectByName(groupName);
    var mesh = null;
    if (groupObj) groupObj.traverse(function (c) { if (c.isMesh && !mesh) mesh = c; });
    if (!mesh) throw new Error("BUTTON MODEL.fbx: part not found -- " + groupName);
    var geo = mesh.geometry.clone();
    geo.rotateX(-Math.PI / 2);
    geo.computeBoundingBox();
    return geo;
  }

  function loadButtonModel() {
    return new Promise(function (resolve) {
      new FBXLoader().load("data/BUTTON MODEL.fbx", function (obj) {
        try {
          modelGeo.base = extractGeo(obj, "BUTTON_BASE");
          modelGeo.exterior = extractGeo(obj, "BUTTON_EXTERIOR");
          modelGeo.unpressed = extractGeo(obj, "BUTTON_INTERIOR_-_UNPRESSED");
          modelGeo.pressed = extractGeo(obj, "BUTTON_INTERIOR_-_PRESSED");
          modelReady = true;
        } catch (e) {
          console.error("Failed to process BUTTON MODEL.fbx:", e);
        }
        resolve();
      }, undefined, function (err) {
        console.error("Failed to load BUTTON MODEL.fbx:", err);
        resolve();
      });
    });
  }

  function refreshMaterials() {
    baseMat.dispose();
    buttonMat.dispose();
    baseMat = makeMaterial(settings.baseColor);
    buttonMat = makeMaterial(settings.buttonColor);
    cells.forEach(function (c) {
      c.baseMesh.material = baseMat;
      c.exteriorMesh.material = buttonMat;
      c.unpressedMesh.material = buttonMat;
      c.pressedMesh.material = buttonMat;
      c.extMesh.material = buttonMat;
    });
  }

  var cells = []; // { group, baseMesh, capGroup, exteriorMesh, unpressedMesh, pressedMesh, extMesh, currentGain, pressedAt, pressed, tween }

  // capGroup's resting Y (flush on the base's own scaled top) plus however much height
  // gain has accumulated -- the base and cap are two independently-scaled real objects
  // now, not one procedural cylinder, so this reads the base's actual scaled height
  // rather than assuming it.
  function capRestY(cell) {
    return settings.baseHeight * NATURAL_BASE_HEIGHT + cell.currentGain;
  }

  // Keeps the extension cylinder stretched to exactly fill the gap between the base's
  // top and the cap's current bottom face -- covers both the height-gain case (cap rests
  // higher, gap opens up) and the mid-press case (cap dips toward/into the base, gap
  // shrinks toward 0). The cap's own local origin is already at its authored bottom (no
  // half-height subtraction needed, unlike the old centered placeholder cylinder).
  function updateExtension(cell) {
    var capBottom = cell.capGroup.position.y;
    var baseTop = settings.baseHeight * NATURAL_BASE_HEIGHT;
    var gap = Math.max(0.0005, capBottom - baseTop);
    cell.extMesh.scale.y = gap;
    cell.extMesh.position.y = baseTop + gap / 2;
  }

  // Row stagger: alternating (odd rows offset, even rows not) by default, or a growing
  // cumulative offset per row when the checkbox is on -- mirrors the 2D project's
  // rowXOffset()/cumulativeRowOffset exactly.
  function rowXOffset(r) {
    if (settings.cumulativeRowOffset) return r * settings.rowXOffset;
    return (r % 2) ? settings.rowXOffset : 0;
  }

  function regenerateGrid() {
    if (!modelReady) return; // first call is deferred until the model finishes loading (see Init)
    cells.forEach(function (c) { c.group.parent.remove(c.group); });
    cells = [];

    var cols = settings.colCount, rows = settings.rowCount;
    var spacingX = settings.colSpacing * (NATURAL_BASE_RADIUS * settings.baseRadius * 2.2);
    var spacingZ = settings.rowSpacing * (NATURAL_BASE_RADIUS * settings.baseRadius * 2.2);
    var totalW = (cols - 1) * spacingX;
    var totalD = (rows - 1) * spacingZ;

    ground.scale.set(settings.groundSize, settings.groundSize, 1);
    groundMat.color.set(settings.groundColor);

    var extGeo = new THREE.CylinderGeometry(settings.extensionRadius, settings.extensionRadius, 1, 24);

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var group = new THREE.Group();
        group.position.set(c * spacingX - totalW / 2 + rowXOffset(r), 0, r * spacingZ - totalD / 2);

        var baseMesh = new THREE.Mesh(modelGeo.base, baseMat);
        baseMesh.scale.set(settings.baseRadius, settings.baseHeight, settings.baseRadius);
        group.add(baseMesh);

        var extMesh = new THREE.Mesh(extGeo, buttonMat);
        group.add(extMesh);

        var capGroup = new THREE.Group();
        capGroup.scale.set(settings.buttonRadius, settings.buttonHeight, settings.buttonRadius);
        group.add(capGroup);

        var exteriorMesh = new THREE.Mesh(modelGeo.exterior, buttonMat);
        exteriorMesh.userData.isButton = true;
        capGroup.add(exteriorMesh);

        var unpressedMesh = new THREE.Mesh(modelGeo.unpressed, buttonMat);
        capGroup.add(unpressedMesh);

        var pressedMesh = new THREE.Mesh(modelGeo.pressed, buttonMat);
        pressedMesh.visible = false;
        capGroup.add(pressedMesh);

        var cell = {
          group: group, baseMesh: baseMesh, capGroup: capGroup,
          exteriorMesh: exteriorMesh, unpressedMesh: unpressedMesh, pressedMesh: pressedMesh, extMesh: extMesh,
          currentGain: 0, pressedAt: 0, pressed: false, tween: null
        };
        exteriorMesh.userData.cell = cell;
        capGroup.position.y = capRestY(cell);
        updateExtension(cell);
        cells.push(cell);
        scene.add(group);
      }
    }
  }

  function applyCameraSettings() {
    camera.fov = settings.cameraFov;
    camera.position.set(settings.cameraX, settings.cameraHeight, settings.cameraDistance);
    camera.rotation.set(
      THREE.MathUtils.degToRad(settings.cameraRotX),
      THREE.MathUtils.degToRad(settings.cameraRotY),
      THREE.MathUtils.degToRad(settings.cameraRotZ)
    );
    camera.updateProjectionMatrix();
  }

  // ---- Interaction: press = compress down instantly, swap to the modeled PRESSED
  // interior shape; release = spring to a NEW resting height (higher on a quick click,
  // lower after a deliberate hold, floored at 0) and swap back to UNPRESSED -- mirrors
  // the 2D BUTTSONS project's pressCell()/releaseCell() (and its dome-up/dome-pressed
  // swap) exactly, just driving a real 3D Y position instead of a CSS transform. ----
  function tweenTo(cell, targetY, durationMs) {
    cell.tween = { fromY: cell.capGroup.position.y, toY: targetY, start: performance.now(), duration: Math.max(1, durationMs) };
  }

  function pressCell(cell) {
    if (cell.pressed) return;
    cell.pressed = true;
    cell.pressedAt = performance.now();
    cell.unpressedMesh.visible = false;
    cell.pressedMesh.visible = true;
    tweenTo(cell, capRestY(cell) - settings.clickIntensity, 0);
  }

  function releaseCell(cell) {
    if (!cell.pressed) return;
    cell.pressed = false;
    var heldMs = performance.now() - cell.pressedAt;
    var wasHeld = heldMs >= settings.holdThresholdMs;
    cell.currentGain = wasHeld
      ? Math.max(0, cell.currentGain - settings.heightGainPerClick)
      : cell.currentGain + settings.heightGainPerClick;
    cell.unpressedMesh.visible = true;
    cell.pressedMesh.visible = false;
    tweenTo(cell, capRestY(cell), settings.releaseMs);
  }

  var raycaster = new THREE.Raycaster();
  var pointerNDC = new THREE.Vector2();
  var activePointers = new Map();

  function pickCell(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    var hits = raycaster.intersectObjects(cells.map(function (c) { return c.exteriorMesh; }), false);
    return hits.length ? hits[0].object.userData.cell : null;
  }

  canvas.addEventListener("pointerdown", function (e) {
    var cell = pickCell(e.clientX, e.clientY);
    if (!cell) return;
    activePointers.set(e.pointerId, cell);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    pressCell(cell);
  });
  function handlePointerEnd(e) {
    var cell = activePointers.get(e.pointerId);
    if (!cell) return;
    activePointers.delete(e.pointerId);
    releaseCell(cell);
  }
  canvas.addEventListener("pointerup", handlePointerEnd);
  canvas.addEventListener("pointercancel", handlePointerEnd);

  // ---- Render loop ----
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    // Guard against a 0-sized read (some environments report 0 for both on the very
    // first script tick of a brand-new tab, before layout has run) -- skip rather than
    // sizing the renderer to nothing; the requestAnimationFrame retry below and the
    // normal window "resize" listener both get another chance once real values exist.
    if (w <= 0 || h <= 0) return;
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function animate() {
    requestAnimationFrame(animate);
    var now = performance.now();
    cells.forEach(function (c) {
      if (c.tween) {
        if (c.tween.duration <= 1) {
          c.capGroup.position.y = c.tween.toY;
          c.tween = null;
        } else {
          var t = Math.min(1, (now - c.tween.start) / c.tween.duration);
          c.capGroup.position.y = c.tween.fromY + (c.tween.toY - c.tween.fromY) * easeOutCubic(t);
          if (t >= 1) c.tween = null;
        }
      }
      updateExtension(c);
    });
    renderer.render(scene, camera);
  }

  // ---- applySetting / dev panel plumbing (mechanics ported from BUTTSONS) ----
  function formatValue(cfg, value) {
    if (cfg.integer) return Math.round(value) + (cfg.unit ? " " + cfg.unit : "");
    return (Math.round(value * 1000) / 1000) + (cfg.unit ? " " + cfg.unit : "");
  }

  function applySetting(cfg, rawValue, opts) {
    opts = opts || {};
    var value = cfg.integer ? Math.round(rawValue) : rawValue;
    settings[cfg.key] = value;

    var slider = document.getElementById("slider-" + cfg.key);
    if (slider) slider.value = value;
    var valueEl = document.getElementById("value-" + cfg.key);
    if (valueEl && !valueEl.querySelector("input")) valueEl.textContent = formatValue(cfg, value);

    applyCssVar(cfg, value);
    if (cfg.camera) applyCameraSettings();
    if (cfg.light) applyLightSettings();
    if (cfg.material) refreshMaterials();
    if (cfg.scene) { groundMat.color.set(settings.groundColor); }
    if (cfg.regen && !opts.skipRegen) regenerateGrid();
  }

  function applyAllSettings() {
    SLIDER_CONFIG.forEach(function (cfg) { applySetting(cfg, settings[cfg.key], { skipRegen: true }); });
    CHECKBOX_CONFIG.forEach(function (cfg) {
      var input = document.getElementById("check-" + cfg.key);
      if (input) input.checked = settings[cfg.key];
    });
    COLOR_CONFIG.forEach(function (cfg) {
      applyCssVar(cfg, settings[cfg.key]);
      var input = document.getElementById("color-" + cfg.key);
      if (input) input.value = settings[cfg.key];
    });
    applyCameraSettings();
    applyLightSettings();
    refreshMaterials();
    regenerateGrid();
  }

  function makeValueEditable(cfg, valueEl) {
    valueEl.addEventListener("click", function () {
      if (valueEl.querySelector("input")) return;
      var current = settings[cfg.key];
      valueEl.textContent = "";
      var input = document.createElement("input");
      input.type = "number";
      input.step = cfg.step;
      input.value = current;
      valueEl.appendChild(input);
      input.focus();
      input.select();
      function commit() {
        var parsed = parseFloat(input.value);
        if (!isNaN(parsed)) {
          if (parsed < cfg.min) { cfg.min = parsed - Math.abs(parsed) * 0.2; document.getElementById("slider-" + cfg.key).min = cfg.min; }
          if (parsed > cfg.max) { cfg.max = parsed + Math.abs(parsed) * 0.2; document.getElementById("slider-" + cfg.key).max = cfg.max; }
          applySetting(cfg, parsed);
        } else {
          valueEl.textContent = formatValue(cfg, settings[cfg.key]);
        }
      }
      input.addEventListener("blur", commit);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") input.blur();
        if (e.key === "Escape") { valueEl.textContent = formatValue(cfg, settings[cfg.key]); }
      });
    });
  }

  function renderControl(cfg) {
    var row = document.createElement("div");
    row.className = "dev-row";
    row.dataset.key = cfg.key;
    if (cfg.deviceTab) row.classList.add("dev-tab-" + cfg.deviceTab);

    var grip = document.createElement("span");
    grip.className = "drag-grip";
    grip.textContent = "☰";
    row.appendChild(grip);

    if (cfg.type === "checkbox") {
      var label = document.createElement("label");
      label.className = "dev-checkbox-row";
      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = "check-" + cfg.key;
      checkbox.checked = settings[cfg.key];
      checkbox.addEventListener("change", function () {
        settings[cfg.key] = checkbox.checked;
        if (cfg.material) refreshMaterials();
        if (cfg.regen) regenerateGrid();
      });
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(" " + cfg.label));
      row.appendChild(label);
      return row;
    }

    if (cfg.type === "color") {
      var main = document.createElement("div");
      main.className = "dev-row-main dev-color-row";
      var colorLabel = document.createElement("span");
      colorLabel.className = "dev-setting-label";
      colorLabel.textContent = cfg.label;
      var colorInput = document.createElement("input");
      colorInput.type = "color";
      colorInput.id = "color-" + cfg.key;
      colorInput.value = settings[cfg.key];
      colorInput.addEventListener("input", function () {
        settings[cfg.key] = colorInput.value;
        applyCssVar(cfg, colorInput.value);
        if (cfg.material) refreshMaterials();
        if (cfg.scene) groundMat.color.set(settings.groundColor);
      });
      main.appendChild(colorLabel);
      main.appendChild(colorInput);
      row.appendChild(main);
      return row;
    }

    var main2 = document.createElement("div");
    main2.className = "dev-row-main";
    var label2 = document.createElement("span");
    label2.className = "dev-setting-label";
    label2.textContent = cfg.label;
    main2.appendChild(label2);

    var controls = document.createElement("div");
    controls.className = "dev-controls";
    var slider = document.createElement("input");
    slider.type = "range";
    slider.id = "slider-" + cfg.key;
    slider.min = cfg.min;
    slider.max = cfg.max;
    slider.step = cfg.step;
    slider.value = settings[cfg.key];
    controls.appendChild(slider);

    var valueEl = document.createElement("span");
    valueEl.className = "dev-value";
    valueEl.id = "value-" + cfg.key;
    valueEl.textContent = formatValue(cfg, settings[cfg.key]);
    controls.appendChild(valueEl);

    main2.appendChild(controls);
    row.appendChild(main2);

    slider.addEventListener("input", function () { applySetting(cfg, parseFloat(slider.value)); });
    makeValueEditable(cfg, valueEl);
    return row;
  }

  function buildPanelContent() {
    groupsHost.innerHTML = "";
    settings._groupOrder.forEach(function (groupId) {
      var def = GROUP_DEFS.filter(function (g) { return g.id === groupId; })[0];
      if (!def) return;
      var groupEl = document.createElement("div");
      groupEl.className = "dev-group";
      groupEl.dataset.groupId = groupId;
      if (settings._collapsedGroups.indexOf(groupId) !== -1) groupEl.classList.add("collapsed");

      var header = document.createElement("div");
      header.className = "dev-group-header";
      var grip = document.createElement("span");
      grip.className = "drag-grip";
      grip.textContent = "☰";
      var title = document.createElement("span");
      title.className = "dev-group-title";
      title.textContent = def.title;
      var caret = document.createElement("span");
      caret.className = "dev-group-caret";
      caret.textContent = "▼";
      header.appendChild(grip);
      header.appendChild(title);
      header.appendChild(caret);
      header.addEventListener("click", function (e) {
        if (e.target === grip) return;
        groupEl.classList.toggle("collapsed");
        var idx = settings._collapsedGroups.indexOf(groupId);
        if (groupEl.classList.contains("collapsed")) {
          if (idx === -1) settings._collapsedGroups.push(groupId);
        } else if (idx !== -1) {
          settings._collapsedGroups.splice(idx, 1);
        }
      });
      groupEl.appendChild(header);

      var body = document.createElement("div");
      body.className = "dev-group-body";
      (settings._itemOrderByGroup[groupId] || []).forEach(function (key) {
        var cfg = CONTROL_BY_KEY[key];
        if (cfg) body.appendChild(renderControl(cfg));
      });
      groupEl.appendChild(body);
      groupsHost.appendChild(groupEl);
    });
  }

  function initSortable() {
    var dragEl = null, isGroup = false;
    groupsHost.addEventListener("pointerdown", function (e) {
      var grip = e.target.closest(".drag-grip");
      if (!grip) return;
      var groupItem = grip.closest(".dev-group");
      var rowItem = grip.closest(".dev-row");
      isGroup = !!grip.closest(".dev-group-header");
      dragEl = isGroup ? groupItem : rowItem;
      if (!dragEl) return;
      dragEl.classList.add("dragging-item");
      try { grip.setPointerCapture(e.pointerId); } catch (err) {}

      function onMove(ev) {
        if (!dragEl) return;
        var el = document.elementFromPoint(ev.clientX, ev.clientY);
        var selector = isGroup ? ".dev-group" : ".dev-row";
        var target = el && el.closest(selector);
        if (!target || target === dragEl || target.parentElement !== dragEl.parentElement) return;
        var rect = target.getBoundingClientRect();
        var before = (ev.clientY - rect.top) < rect.height / 2;
        target.parentElement.insertBefore(dragEl, before ? target : target.nextSibling);
      }
      function onUp() {
        grip.removeEventListener("pointermove", onMove);
        grip.removeEventListener("pointerup", onUp);
        grip.removeEventListener("pointercancel", onUp);
        if (!dragEl) return;
        dragEl.classList.remove("dragging-item");
        if (isGroup) {
          settings._groupOrder = Array.from(groupsHost.children).map(function (el) { return el.dataset.groupId; });
        } else {
          var body = dragEl.parentElement;
          var groupId = body.closest(".dev-group").dataset.groupId;
          settings._itemOrderByGroup[groupId] = Array.from(body.children).map(function (el) { return el.dataset.key; });
        }
        dragEl = null;
      }
      grip.addEventListener("pointermove", onMove);
      grip.addEventListener("pointerup", onUp);
      grip.addEventListener("pointercancel", onUp);
    });
  }

  function currentGeometryKey() { return isMobileActive() ? "_panelGeometryMobile" : "_panelGeometryDesktop"; }

  function clampPanelSize(geo) {
    var minW = 260, minH = 160;
    var maxW = Math.max(minW, window.innerWidth);
    var maxH = Math.max(minH, window.innerHeight);
    geo.width = Math.min(Math.max(geo.width, minW), maxW);
    geo.height = Math.min(Math.max(geo.height, minH), maxH);
    geo.left = Math.min(Math.max(geo.left, 0), Math.max(0, window.innerWidth - geo.width));
    geo.top = Math.min(Math.max(geo.top, 0), Math.max(0, window.innerHeight - geo.height));
    return geo;
  }

  function applyPanelGeometry() {
    var geo = settings[currentGeometryKey()];
    if (!geo) {
      geo = { top: 12, left: Math.max(12, window.innerWidth - 320), width: 300, height: 560 };
    }
    geo = clampPanelSize(geo);
    devPanel.style.top = geo.top + "px";
    devPanel.style.left = geo.left + "px";
    devPanel.style.width = geo.width + "px";
    devPanel.style.height = geo.height + "px";
  }

  function savePanelGeometry() {
    var rect = devPanel.getBoundingClientRect();
    settings[currentGeometryKey()] = { top: rect.top, left: rect.left, width: rect.width, height: rect.height };
  }

  function initPanelDragResize() {
    var titlebar = devPanel.querySelector(".dev-titlebar");
    var collapseBtn = document.getElementById("devCollapseBtn");

    titlebar.addEventListener("pointerdown", function (e) {
      if (e.target === collapseBtn) return;
      var startX = e.clientX, startY = e.clientY;
      var rect = devPanel.getBoundingClientRect();
      var startLeft = rect.left, startTop = rect.top;
      try { titlebar.setPointerCapture(e.pointerId); } catch (err) {}
      function onMove(ev) {
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        var newLeft = Math.max(0, Math.min(window.innerWidth - devPanel.offsetWidth, startLeft + dx));
        var newTop = Math.max(0, Math.min(window.innerHeight - devPanel.offsetHeight, startTop + dy));
        devPanel.style.left = newLeft + "px";
        devPanel.style.top = newTop + "px";
      }
      function onUp() {
        titlebar.removeEventListener("pointermove", onMove);
        titlebar.removeEventListener("pointerup", onUp);
        titlebar.removeEventListener("pointercancel", onUp);
        savePanelGeometry();
      }
      titlebar.addEventListener("pointermove", onMove);
      titlebar.addEventListener("pointerup", onUp);
      titlebar.addEventListener("pointercancel", onUp);
    });

    var edges = Array.from(devPanel.querySelectorAll(".dev-resize-edge, .dev-resize-corner"));
    edges.forEach(function (handle) {
      handle.addEventListener("pointerdown", function (e) {
        e.stopPropagation();
        var startX = e.clientX, startY = e.clientY;
        var rect = devPanel.getBoundingClientRect();
        var startLeft = rect.left, startTop = rect.top, startW = rect.width, startH = rect.height;
        var cls = handle.className;
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
        function onMove(ev) {
          var dx = ev.clientX - startX, dy = ev.clientY - startY;
          var newLeft = startLeft, newTop = startTop, newW = startW, newH = startH;
          if (/\bn\b/.test(cls) || /nw|ne/.test(cls)) { newTop = startTop + dy; newH = startH - dy; }
          if (/\bs\b/.test(cls) || /sw|se/.test(cls)) { newH = startH + dy; }
          if (/\bw\b/.test(cls) || /nw|sw/.test(cls)) { newLeft = startLeft + dx; newW = startW - dx; }
          if (/\be\b/.test(cls) || /ne|se/.test(cls)) { newW = startW + dx; }
          newW = Math.max(260, newW);
          newH = Math.max(160, newH);
          devPanel.style.left = newLeft + "px";
          devPanel.style.top = newTop + "px";
          devPanel.style.width = newW + "px";
          devPanel.style.height = newH + "px";
        }
        function onUp() {
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onUp);
          handle.removeEventListener("pointercancel", onUp);
          savePanelGeometry();
        }
        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onUp);
        handle.addEventListener("pointercancel", onUp);
      });
    });

    collapseBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      devPanel.classList.toggle("collapsed");
      collapseBtn.innerHTML = devPanel.classList.contains("collapsed") ? "&#9660;" : "&#9650;";
    });

    Array.prototype.forEach.call(devPanel.querySelectorAll(".dev-tab-btn"), function (btn) {
      btn.addEventListener("click", function () {
        devPanel.classList.remove("tab-desktop", "tab-mobile");
        devPanel.classList.add("tab-" + btn.dataset.tab);
      });
    });

    document.addEventListener("keydown", function (e) {
      if (e.key.toLowerCase() !== "d") return;
      var t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (!document.body.classList.contains("dev-enabled")) return;
      document.body.classList.toggle("dev-hidden");
    });
  }

  function flashButton(btn, text) {
    var original = btn.textContent;
    btn.textContent = text;
    setTimeout(function () { btn.textContent = original; }, 900);
  }

  document.getElementById("btnCopy").addEventListener("click", function () {
    var btn = this;
    var json = JSON.stringify(settings, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(function () { flashButton(btn, "Copied!"); }, function () { fallbackCopy(json, btn); });
    } else {
      fallbackCopy(json, btn);
    }
  });
  function fallbackCopy(text, btn) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); flashButton(btn, "Copied!"); } catch (e) { flashButton(btn, "Copy failed"); }
    document.body.removeChild(ta);
  }

  document.getElementById("btnSave").addEventListener("click", function () {
    var btn = this;
    savePanelGeometry();
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(settings));
      savedDefaults = deepClone(settings);
      flashButton(btn, "Saved (local)!");
    } catch (e) {
      flashButton(btn, "Save failed");
    }
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    settings = deepClone(savedDefaults);
    buildPanelContent();
    applyAllSettings();
    applyPanelGeometry();
  });

  MOBILE_MEDIA_QUERY.addEventListener("change", function () {
    applyPanelGeometry();
  });
  window.addEventListener("resize", function () { applyPanelGeometry(); resize(); });

  // ---- Init ----
  devPanel.classList.add(isMobileActive() ? "tab-mobile" : "tab-desktop");
  resize();
  requestAnimationFrame(resize); // retry once more in case the call above was skipped (0x0)
  buildPanelContent();
  initSortable();
  initPanelDragResize();
  applyPanelGeometry();
  animate();
  // Grid/material/camera/light setup waits on the button model finishing its async load
  // (regenerateGrid() no-ops via its own modelReady guard until then anyway, but calling
  // applyAllSettings() only after resolve avoids doing that work twice).
  loadButtonModel().then(applyAllSettings);
})();
</script>
</body>
</html>
